name: LifeTag Build & Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-client:
    name: Build React Client
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'client/package-lock.json'

    - name: Install Client Dependencies
      run: |
        cd client
        npm install

    - name: Run Client Linting
      run: |
        cd client
        npm run lint

    - name: Verify Client TypeScript and Build
      run: |
        cd client
        npm run build

    - name: Run Client Tests with Coverage Gate
      run: |
        cd client
        npx vitest run --coverage

  build-server:
    name: Build Express Server
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lifetag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'server/package-lock.json'

    - name: Install Server Dependencies
      run: |
        cd server
        npm install

    - name: Run Server Linting
      run: |
        cd server
        npm run lint

    - name: Verify Server TypeScript and Build
      run: |
        cd server
        npm run build

    - name: Run Prisma DB Push
      run: |
        cd server
        npx prisma db push
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifetag_test?schema=public

    - name: Run Server Tests
      run: |
        cd server
        npm run test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifetag_test?schema=public

