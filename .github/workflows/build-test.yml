name: LifeTag Build & Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-client:
    name: Build React Client
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'client/package-lock.json'

    - name: Install Client Dependencies
      run: |
        cd client
        npm install

    - name: Verify Client TypeScript and Build
      run: |
        cd client
        npm run build

  build-server:
    name: Build Express Server
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'server/package-lock.json'

    - name: Install Server Dependencies
      run: |
        cd server
        npm install

    - name: Verify Server TypeScript and Build
      run: |
        cd server
        npm run build
